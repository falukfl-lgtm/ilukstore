<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Assabil Store</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .admin-login { max-width:380px; margin:80px auto; padding:32px; background:var(--card); border-radius:16px; border:1px solid var(--border); }
  .admin-panel { max-width:600px; margin:24px auto; padding:16px; }
  .order-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  .order-card .order-head { font-family:'Orbitron',monospace; font-size:11px; color:var(--red); letter-spacing:2px; margin-bottom:10px; }
  .order-row { display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
  .order-row .k { color:var(--muted); }
  .order-row .v { color:var(--text); font-weight:600; }
  .btn-approve { width:100%; background:linear-gradient(135deg,#1a7a1a,#0d5c0d); border:none; border-radius:8px; padding:12px; color:#fff; font-family:'Orbitron',monospace; font-size:11px; font-weight:700; letter-spacing:2px; cursor:pointer; margin-top:10px; }
  .btn-approve:disabled { background:#2a2a3a; color:#6b6b8a; cursor:not-allowed; }
  .btn-reject { width:100%; background:linear-gradient(135deg,#7a1a1a,#5c0d0d); border:none; border-radius:8px; padding:12px; color:#fff; font-family:'Orbitron',monospace; font-size:11px; font-weight:700; letter-spacing:2px; cursor:pointer; margin-top:6px; }
  .status-badge { display:inline-block; padding:4px 10px; border-radius:20px; font-size:10px; font-weight:700; letter-spacing:1px; }
  .status-pending { background:rgba(255,165,2,0.2); color:#ffa502; border:1px solid #ffa502; }
  .status-success { background:rgba(46,213,115,0.2); color:#2ed573; border:1px solid #2ed573; }
  .status-rejected { background:rgba(232,0,28,0.2); color:#e8001c; border:1px solid #e8001c; }
  .empty-state { text-align:center; padding:40px; color:var(--muted); font-size:14px; }
  .admin-topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .btn-logout { background:none; border:1px solid var(--border); border-radius:8px; padding:8px 16px; color:var(--muted); font-size:12px; cursor:pointer; }
</style>
</head>
<body>

<!-- LOGIN ADMIN -->
<div id="admin-login" class="wrap">
  <div class="admin-login">
    <div style="text-align:center;margin-bottom:24px;">
      <div class="brand" style="font-family:'Orbitron',monospace;font-size:20px;color:#e8001c;">ADMIN</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px;">Assabil Store Panel</div>
    </div>
    <label>Password Admin</label>
    <input type="password" id="inp-pass" placeholder="Masukkan password..." style="margin-bottom:16px;">
    <button class="btn-red" onclick="doAdminLogin()">MASUK</button>
  </div>
</div>

<!-- PANEL ADMIN -->
<div id="admin-panel" class="wrap" style="display:none;">
  <div class="admin-panel">
    <div class="admin-topbar">
      <div style="font-family:'Orbitron',monospace;font-size:16px;color:#e8001c;">📋 ORDER MASUK</div>
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>
    <div id="order-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="script.js"></script>
<script>
const ADMIN_PASS = 'fatihganteng123Banget';
const ORDERS_KEY = 'assabil_orders';

function doAdminLogin() {
  const pass = document.getElementById('inp-pass').value;
  if (pass === ADMIN_PASS) {
    document.getElementById('admin-login').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    loadOrders();
  } else {
    toast('❌ Password salah!');
  }
}

document.getElementById('inp-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doAdminLogin();
});

function doLogout() {
  document.getElementById('admin-login').style.display = 'block';
  document.getElementById('admin-panel').style.display = 'none';
  document.getElementById('inp-pass').value = '';
}

function loadOrders() {
  const orders = JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]');
  const list = document.getElementById('order-list');

  if (orders.length === 0) {
    list.innerHTML = '<div class="empty-state">📭 Belum ada order masuk</div>';
    return;
  }

  // Tampilkan order terbaru dulu
  const sorted = orders.slice().reverse();
  list.innerHTML = sorted.map((o, i) => `
    <div class="order-card" id="card-${o.trxId}">
      <div class="order-head">🧾 ${o.trxId}</div>
      <div class="order-row"><span class="k">Tanggal</span><span class="v">${o.tgl}</span></div>
      <div class="order-row"><span class="k">Pembeli</span><span class="v">${o.user}</span></div>
      <div class="order-row"><span class="k">Game</span><span class="v">${o.game}</span></div>
      <div class="order-row"><span class="k">ID Game</span><span class="v">${o.gameId}</span></div>
      <div class="order-row"><span class="k">Item</span><span class="v">${o.item}</span></div>
      <div class="order-row"><span class="k">Total</span><span class="v" style="color:#e8001c;">${o.price}</span></div>
      <div class="order-row"><span class="k">Status</span><span class="v">
        <span class="status-badge ${o.status === 'pending' ? 'status-pending' : o.status === 'success' ? 'status-success' : 'status-rejected'}">
          ${o.status === 'pending' ? '⏳ MENUNGGU' : o.status === 'success' ? '✅ DIPROSES' : '❌ DITOLAK'}
        </span>
      </span></div>
      ${o.status === 'pending' ? `
        <button class="btn-approve" onclick="approveOrder('${o.trxId}')">✅ APPROVE & PROSES TOP UP</button>
        <button class="btn-reject" onclick="rejectOrder('${o.trxId}')">❌ TOLAK ORDER</button>
      ` : ''}
    </div>
  `).join('');
}

async function approveOrder(trxId) {
  const orders = JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]');
  const order = orders.find(o => o.trxId === trxId);
  if (!order) return;

  const btn = document.querySelector(`#card-${trxId} .btn-approve`);
  btn.textContent = '⏳ Memproses...';
  btn.disabled = true;

  try {
    const res = await fetch('/.netlify/functions/create-payment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        buyerName:   order.user,
        productCode: order.productCode,
        gameId:      order.gameId,
        zoneId:      order.zoneId || '',
        itemName:    order.item,
        price:       order.rawPrice
      })
    });

    const data = await res.json();

    if (data.success) {
      updateOrderStatus(trxId, 'success');
      toast('✅ Top up berhasil diproses!');
    } else {
      btn.textContent = '✅ APPROVE & PROSES TOP UP';
      btn.disabled = false;
      toast('❌ Gagal: ' + (data.message || 'Error'));
    }
  } catch (err) {
    btn.textContent = '✅ APPROVE & PROSES TOP UP';
    btn.disabled = false;
    toast('❌ Error: ' + err.message);
  }
}

function rejectOrder(trxId) {
  if (!confirm('Yakin tolak order ini?')) return;
  updateOrderStatus(trxId, 'rejected');
  toast('❌ Order ditolak');
}

function updateOrderStatus(trxId, status) {
  const orders = JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]');
  const idx = orders.findIndex(o => o.trxId === trxId);
  if (idx !== -1) {
    orders[idx].status = status;
    localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
  }
  loadOrders();
}
</script>
</body>
</html>
